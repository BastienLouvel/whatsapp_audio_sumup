services:
  whatsapp-summarizer:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DEFAULT_LLM=openai
      - DEFAULT_STYLE=pro
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command:
      - "http"
      - "whatsapp-summarizer:8000"
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    ports:
      - "4040:4040"
    depends_on:
      - whatsapp-summarizer
